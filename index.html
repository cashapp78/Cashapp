<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deceptive Website Warning</title>

<style>
    body {
        margin: 0;
        background-color: #e53935;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
        padding: 24px;
        max-width: 680px;
    }

    .header {
        display: flex;
        align-items: flex-start;
        gap: 14px;
    }

    .icon {
        width: 34px;
        height: 34px;
        min-width: 34px;
        border-radius: 50%;
        background: white;
        color: #e53935;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 18px;
        margin-top: 6px;
    }

    h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 500;
        line-height: 1.2;
    }

    p {
        margin-top: 22px;
        font-size: 17px;
        line-height: 1.55;
        max-width: 620px;
    }

    .actions {
        margin-top: 28px;
    }

    .actions a {
        color: white;
        text-decoration: underline;
        font-size: 17px;
        margin-right: 28px;
    }

    .actions a:active {
        opacity: 0.7;
    }

    /* Make it center nicely on larger screens */
    @media (min-width: 768px) {
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 44px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <div class="icon">!</div>
        <h1>Deceptive<br>Website Warning</h1>
    </div>

    <p>
        This website may try to trick you into doing something dangerous, like installing software or
        disclosing personal or financial information, like passwords, phone numbers, or credit cards.
    </p>

    <div class="actions">
        <a href="#">Show Details</a>
        <a href="#">Go Back</a>
    </div>
</div>

</body>
</html>
