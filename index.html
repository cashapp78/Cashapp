<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deceptive Website Warning</title>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #e53935; /* red background */
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    .container {
        text-align: left;
        max-width: 700px;
    }

    .header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }

    .icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: white;
        color: #e53935;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 22px;
        margin-right: 15px;
    }

    h1 {
        font-size: 48px;
        margin: 0;
        font-weight: 500;
    }

    p {
        font-size: 20px;
        line-height: 1.6;
        margin-top: 20px;
    }

    .actions {
        margin-top: 30px;
    }

    .actions a {
        color: white;
        text-decoration: underline;
        font-size: 18px;
        margin-right: 25px;
        cursor: pointer;
    }

    .actions a:hover {
        opacity: 0.8;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon">!</div>
        <h1>Deceptive<br>Website Warning</h1>
    </div>

    <p>
        This website may try to trick you into doing something dangerous,
        like installing software or disclosing personal or financial information,
        like passwords, phone numbers, or credit cards.
    </p>

    <div class="actions">
        <a href="#">Show Details</a>
        <a href="#">Go Back</a>
    </div>
</div>

</body>
</html>
